<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Outer border gradient matching website navbar (emerald -> teal -> emerald) -->
    <linearGradient id="badgeBorder" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Frog Skin Gradient -->
    <linearGradient id="frogSkinGradient" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Frog Cheek Gradient -->
    <linearGradient id="frogCheekGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Outer Gradient Border -->
  <rect x="1" y="1" width="46" height="46" rx="13" fill="url(#badgeBorder)" />

  <!-- Inner Dark Slate Card (matching website bg-slate-950) -->
  <rect x="3" y="3" width="42" height="42" rx="11" fill="#020617" />

  <!-- Centered FrogFace Mascot inside the badge -->
  <g transform="translate(6.5, 6.5) scale(0.73)">
    <!-- Frog Body & Head -->
    <path d="M8 26C8 16.5 15.5 13 24 13C32.5 13 40 16.5 40 26C40 35.5 33 41 24 41C15 41 8 35.5 8 26Z" fill="url(#frogSkinGradient)" />

    <!-- Eyes - Bulbs -->
    <circle cx="15" cy="15" r="9" fill="url(#frogSkinGradient)" />
    <circle cx="33" cy="15" r="9" fill="url(#frogSkinGradient)" />

    <!-- Eyes - White Sclera -->
    <circle cx="15" cy="15" r="6.5" fill="#FFFFFF" />
    <circle cx="33" cy="15" r="6.5" fill="#FFFFFF" />

    <!-- Eyes - Dark Pupils -->
    <circle cx="16" cy="15" r="3.6" fill="#0F172A" />
    <circle cx="32" cy="15" r="3.6" fill="#0F172A" />

    <!-- Eyes - Sparkle Highlights -->
    <circle cx="17.5" cy="13.5" r="1.4" fill="#FFFFFF" />
    <circle cx="33.5" cy="13.5" r="1.4" fill="#FFFFFF" />
    <circle cx="14.5" cy="16.5" r="0.8" fill="#FFFFFF" />
    <circle cx="30.5" cy="16.5" r="0.8" fill="#FFFFFF" />

    <!-- Nostrils -->
    <ellipse cx="21.5" cy="24.5" rx="1.2" ry="0.9" fill="#047857" opacity="0.85" />
    <ellipse cx="26.5" cy="24.5" rx="1.2" ry="0.9" fill="#047857" opacity="0.85" />

    <!-- Mouth -->
    <path d="M17.5 29.5C19.5 33.5 28.5 33.5 30.5 29.5" stroke="#064E3B" stroke-width="2.2" stroke-linecap="round" />

    <!-- Rosy Cheeks -->
    <ellipse cx="12.5" cy="29" rx="3" ry="1.8" fill="url(#frogCheekGradient)" />
    <ellipse cx="35.5" cy="29" rx="3" ry="1.8" fill="url(#frogCheekGradient)" />
  </g>
</svg>
